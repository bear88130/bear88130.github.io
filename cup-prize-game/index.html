<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸運猜杯子｜獎品挑戰</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#26334b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:880px;margin:auto;padding:22px 14px 55px}h1{text-align:center;margin:10px 0 4px;font-size:29px}.subtitle{text-align:center;color:#718096;margin:0 0 20px}.stage{height:330px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 50% 10%,#49668f,#17253f 78%);box-shadow:0 12px 30px #1c33542b}.stage:after{content:"";position:absolute;bottom:43px;left:4%;right:4%;height:2px;background:#b7c9dd55}.status{position:absolute;top:18px;left:12px;right:12px;color:white;text-align:center;font-weight:700;z-index:5}.cup{position:absolute;top:120px;width:70px;height:105px;z-index:3;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:left,transform;touch-action:manipulation}.body{width:66px;height:80px;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);background:linear-gradient(90deg,#92501f,#d68d45 25%,#ffe2a1 48%,#d48d47 75%,#995425);border-radius:7px}.num{position:absolute;top:40px;font-size:20px;font-weight:800;color:#653917}.shadow{margin-top:16px;width:65px;height:9px;background:#060c1999;border-radius:50%;filter:blur(4px)}.prize{position:absolute;top:210px;width:90px;text-align:center;z-index:2;color:#fff;line-height:1.25}.prize .emoji{font-size:32px}.prize .name{font-size:11px;margin-top:5px;text-shadow:0 1px 4px #000}.actions{display:flex;justify-content:center;gap:12px;margin:18px 0}.btn{border:1px solid #d5dbe5;background:white;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700;color:#34435c;cursor:pointer}.btn.primary{background:#d8a55e;color:#2a1d0e;border-color:#d8a55e}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{text-align:center;color:#68768b;min-height:24px}.panel{background:white;border:1px solid #e1e5ed;border-radius:18px;padding:20px;margin-top:18px}h2{font-size:19px;margin:0 0 16px}.setting{margin:16px 0}.setting label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.setting input[type=range]{width:100%;accent-color:#c58c43}.setting select,.entry select{border:1px solid #d7dce5;border-radius:9px;background:#fff;padding:9px;color:#27354b}.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.entry{border:1px solid #e2e5eb;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center}.entry span{white-space:nowrap;font-size:13px}.entry select{min-width:0;width:100%}.result{font-size:17px;font-weight:700}.note{font-size:12px;color:#7b8799;line-height:1.6}.viewbtn{position:fixed;top:14px;right:14px;z-index:20;border:1px solid #d5dbe5;background:#fffffff2;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:#34435c;cursor:pointer;box-shadow:0 4px 12px #1c335418}.viewbtn:hover{background:#fff;border-color:#c58c43}.viewbtn:focus-visible{outline:2px solid #c58c43;outline-offset:2px}@media(max-width:520px){.wrap{padding:12px 10px 36px}.stage{height:285px}.cup{top:105px}.prize{top:190px}.panel{padding:15px}.entries{grid-template-columns:1fr 1fr}.entry{flex-direction:column;align-items:stretch}.entry span{font-size:12px}h1{font-size:25px}.viewbtn{top:10px;right:10px;padding:6px 11px}}
</style></head><body><button class="viewbtn" id="viewToggle" type="button">⚙️ 設定</button><main class="wrap"><h1>🏆 幸運猜杯子</h1><p class="subtitle">記住獎品、追蹤杯子，挑戰你的眼力！</p><div id="gameView"><div class="stage" id="stage"><div class="status" id="status" aria-live="polite">準備好挑戰了嗎？</div><div id="cups"></div><div id="prizes"></div></div><div class="actions"><button class="btn primary" id="start">▶ 開始遊戲</button><button class="btn" id="reset">重新開始</button></div><div class="hint" id="hint">開始後先展示每個杯子的獎品，再進行交換。</div><section class="panel"><h2>抽獎結果</h2><div id="result" class="result">尚未開始遊戲</div></section></div><div id="settingsView" hidden><section class="panel" id="settings"><h2>⚙️ 遊戲設定</h2><div class="setting"><label for="count">杯子數量</label><select id="count"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div class="setting"><label for="preview">獎品展示時間 <b id="previewValue">3 秒</b></label><input id="preview" type="range" min="1" max="10" value="3"></div><div class="setting"><label for="speed">交換速度 <b id="speedValue">3.5×</b></label><input id="speed" type="range" min="0.5" max="4" step="0.5" value="3.5"></div><div class="setting"><label for="rounds">交換次數 <b id="roundsValue">10 次</b></label><input id="rounds" type="range" min="2" max="20" value="10"></div><h2>🎁 每個杯子的獎品</h2><div class="entries" id="config"></div><p class="note">修改設定會重置當前遊戲。獎品會跟著原本的杯子移動，不會在交換途中重新分配。</p></section><p class="note">本遊戲為純靜態網頁；不會記錄玩家身分、限制參加次數或管理實體獎品庫存。</p></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),layer=$('cups'),prizes=$('prizes'),status=$('status'),hint=$('hint'),start=$('start'),config=$('config'),result=$('result');const opts=[['ring','💍','碎碎冰尾戒'],['bikini','🐟','比奇堡居民'],['power','🔋','行動電源'],['perfume','🌸','香水'],['empty','❌','空杯']];let contents=['ring','bikini','power','perfume'],cups=[],xs=[],phase='idle',token=0,selectedId=null;const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms)),info=v=>opts.find(o=>o[0]===v)||opts[4];function layout(){const n=cups.length,w=stage.clientWidth,step=Math.min(105,(w-14)/n),base=(w-step*n)/2;return Array.from({length:n},(_,i)=>base+i*step+(step-70)/2)}function drawConfig(){config.replaceChildren();contents.forEach((v,i)=>{const div=document.createElement('div');div.className='entry';const label=document.createElement('span');label.textContent='杯 '+(i+1);const sel=document.createElement('select');opts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1]+' '+o[2];sel.append(op)});sel.value=v;sel.addEventListener('change',()=>{contents[i]=sel.value;reset()});div.append(label,sel);config.append(div)})}function build(){layer.replaceChildren();prizes.replaceChildren();cups=contents.map((prize,id)=>{const el=document.createElement('div');el.className='cup';el.innerHTML='<div class="body"></div><div class="num">'+(id+1)+'</div><div class="shadow"></div>';el.addEventListener('click',()=>guess(id));layer.append(el);return{id,slot:id,prize,el}});xs=layout();cups.forEach(c=>{c.el.style.transition='none';c.el.style.left=xs[c.slot]+'px';c.el.style.transform='translateY(0)'})}function reset(){token++;phase='idle';selectedId=null;build();status.textContent='準備好挑戰了嗎？';hint.textContent='開始後先展示每個杯子的獎品，再進行交換。';result.textContent='尚未開始遊戲';start.disabled=false}function show(all=true,id=null){prizes.replaceChildren();cups.forEach(c=>{if(!all&&c.id!==id)return;const data=info(c.prize),p=document.createElement('div');p.className='prize';p.style.left=(xs[c.slot]-10)+'px';const emoji=document.createElement('div');emoji.className='emoji';emoji.textContent=data[1];const name=document.createElement('div');name.className='name';name.textContent=data[2];p.append(emoji,name);prizes.append(p)})}function move(c,a,b,h,d,run){return new Promise(resolve=>{const t0=performance.now();function frame(t){if(phase!=='shuffle'||run!==token){resolve();return}const p=Math.min(1,(t-t0)/d),e=p*p*(3-2*p);c.el.style.left=(xs[a]+(xs[b]-xs[a])*e)+'px';c.el.style.transform='translateY('+(-h*Math.sin(Math.PI*p))+'px)';if(p<1)requestAnimationFrame(frame);else{c.el.style.transform='translateY(0)';resolve()}}requestAnimationFrame(frame)})}async function play(){reset();const current=token;phase='preview';start.disabled=true;const seconds=Number($('preview').value);cups.forEach(c=>{c.el.style.transition='transform .4s ease';c.el.style.transform='translateY(-65px)'});show();for(let i=seconds;i>0;i--){if(current!==token)return;status.textContent='記住獎品位置！ '+i+' 秒後開始';await sleep(1000)}if(current!==token)return;prizes.replaceChildren();cups.forEach(c=>c.el.style.transform='translateY(0)');await sleep(500);if(current!==token)return;phase='shuffle';cups.forEach(c=>c.el.style.transition='none');const rounds=Number($('rounds').value),speed=Number($('speed').value);for(let k=0;k<rounds;k++){if(current!==token)return;status.textContent='洗杯中 '+(k+1)+' / '+rounds;const a=Math.floor(Math.random()*cups.length),b=(a+1+Math.floor(Math.random()*(cups.length-1)))%cups.length,ca=cups[a],cb=cups[b],sa=ca.slot,sb=cb.slot;await Promise.all([move(ca,sa,sb,34,Math.max(230,950/speed),current),move(cb,sb,sa,76,Math.max(230,950/speed),current)]);if(current!==token)return;ca.slot=sb;cb.slot=sa;await sleep(110)}if(current!==token)return;phase='guess';status.textContent='選一個杯子，揭曉你的獎品！';hint.textContent='點擊你想選擇的杯子。'}function guess(id){if(phase!=='guess')return;phase='done';selectedId=id;const c=cups[id],data=info(c.prize);c.el.style.transition='transform .35s ease';c.el.style.transform='translateY(-65px)';show(false,id);status.textContent=c.prize==='empty'?'這次是空杯，再接再厲！':'🎉 恭喜獲得 '+data[2]+'！';result.textContent='選中第 '+(c.slot+1)+' 個位置：'+data[1]+' '+data[2];hint.textContent='按「開始遊戲」可再玩一局。';start.disabled=false}$('count').addEventListener('change',e=>{const n=Number(e.target.value);contents=Array.from({length:n},(_,i)=>contents[i]??'empty');drawConfig();reset()});[['preview',' 秒'],['speed','×'],['rounds',' 次']].forEach(([id,suffix])=>$(id).addEventListener('input',e=>$(id+'Value').textContent=e.target.value+suffix));function relayout(){if(phase==='shuffle')return;xs=layout();cups.forEach(c=>c.el.style.left=xs[c.slot]+'px');if(phase==='preview')show();if(phase==='done')show(false,selectedId)}$('viewToggle').addEventListener('click',()=>{const toSettings=$('settingsView').hidden;$('settingsView').hidden=!toSettings;$('gameView').hidden=toSettings;$('viewToggle').textContent=toSettings?'🎮 回到遊戲':'⚙️ 設定';if(!toSettings)relayout();window.scrollTo(0,0)});start.addEventListener('click',play);$('reset').addEventListener('click',reset);window.addEventListener('resize',relayout);drawConfig();reset()})();
</script></body></html>
