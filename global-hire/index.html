<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全球人才招募地圖 | Global Career Map</title>
    <!-- 引入 Tailwind CSS 用於快速樣式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 D3.js 與 TopoJSON 用於繪製地理圖形 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #020617; /* Tailwind slate-950 */
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }

        /* 隱藏原生滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }

        #map-container {
            cursor: grab;
        }
        #map-container:active {
            cursor: grabbing;
        }

        /* 國家區塊基礎樣式 */
        .country {
            fill: #334155; /* 預設顏色 slate-700 */
            stroke: #020617; /* 邊界顏色 */
            stroke-width: 0.5px;
            transition: fill 0.3s ease, opacity 0.3s ease, stroke-width 0.2s ease;
            cursor: pointer;
        }

        /* 關鍵效果：當游標懸停在整個國家群組(.countries-group)上時，
           先將「所有」國家變暗 
        */
        .countries-group:hover .country {
            opacity: 0.3;
            fill: #1e293b; /* 更暗的顏色 */
        }

        /* 接著，針對「正被懸停」的特定國家，覆蓋樣式使其亮起 
        */
        .countries-group .country:hover {
            opacity: 1 !important;
            fill: #0ea5e9 !important; /* 亮藍色 sky-500 */
            stroke: #bae6fd !important;
            stroke-width: 1.5px !important;
            /* 將該元素提升至頂層顯示 (需透過JS輔助或使用相對層級，D3中我們利用JS raise) */
        }

        /* 海洋網格線 */
        .graticule {
            fill: none;
            stroke: #1e293b;
            stroke-width: 0.5px;
            opacity: 0.5;
        }

        /* 浮動提示框 Tooltip */
        #tooltip {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.1s ease;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transform: translate(-50%, -120%);
        }

        /* Loading 動畫 */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #0ea5e9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導航/標題 -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="globe-2" class="text-sky-500 w-8 h-8"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-500">
                        全球人才招募地圖
                    </h1>
                    <p class="text-xs md:text-sm text-slate-400">移動游標並點擊國家，探索專屬海外職缺</p>
                </div>
            </div>
            <button class="hidden md:flex items-center gap-2 text-sm text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full transition-colors">
                <i data-lucide="briefcase" class="w-4 h-4"></i>
                我的履歷
            </button>
        </div>
    </header>

    <!-- 主體內容 (地圖區域) -->
    <main class="flex-grow relative w-full flex items-center justify-center p-4 md:p-8">
        
        <!-- Loading 狀態 -->
        <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-slate-950">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 animate-pulse">載入全球地圖資訊中...</p>
        </div>

        <!-- 地圖容器 -->
        <div class="relative w-full max-w-7xl aspect-[4/3] md:aspect-[21/9] bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            
            <!-- SVG 將會掛載於此 -->
            <div id="map-container" class="w-full h-full"></div>

            <!-- 右下角縮放控制 (方便手機與平板用戶) -->
            <div class="absolute bottom-4 right-4 flex flex-col gap-2 z-10">
                <button id="zoom-in" class="bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full backdrop-blur-sm border border-slate-600 transition-colors shadow-lg" title="放大">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button id="zoom-out" class="bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full backdrop-blur-sm border border-slate-600 transition-colors shadow-lg" title="縮小">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button id="zoom-reset" class="bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full backdrop-blur-sm border border-slate-600 transition-colors shadow-lg" title="重設視角">
                    <i data-lucide="maximize" class="w-5 h-5"></i>
                </button>
            </div>
            
            <!-- 手機版操作提示 -->
            <div class="absolute top-4 left-4 right-4 md:hidden text-center z-10 pointer-events-none">
                <span class="bg-slate-800/80 text-slate-200 text-xs px-3 py-1.5 rounded-full backdrop-blur shadow">
                    支援雙指縮放與拖曳平移
                </span>
            </div>
        </div>

    </main>

    <!-- 滑鼠懸浮 Tooltip -->
    <div id="tooltip">
        <!-- 內容由 JS 動態生成 -->
    </div>

    <!-- 初始化圖示 -->
    <script>
        lucide.createIcons();
    </script>

    <!-- 地圖核心邏輯 -->
    <script>
        // 設定模擬的職缺網站對應表
        const jobPortals = {
            "Taiwan": "https://www.104.com.tw/jobs/search/?ro=0&keyword=%E6%B5%B7%E5%A4%96",
            "Japan": "https://www.daijob.com/en/",
            "United States of America": "https://www.linkedin.com/jobs/search/?geoId=103644278",
            "United Kingdom": "https://www.cwjobs.co.uk/",
            "Canada": "https://ca.indeed.com/",
            "Australia": "https://www.seek.com.au/",
            "Germany": "https://www.stepstone.de/en/",
            "Singapore": "https://www.mycareersfuture.gov.sg/"
        };

        // 取得該國職缺連結的函數 (若無設定則預設導向 LinkedIn 搜尋)
        function getJobUrl(countryName) {
            if (jobPortals[countryName]) {
                return jobPortals[countryName];
            }
            return `https://www.linkedin.com/jobs/search?keywords=${encodeURIComponent(countryName)}`;
        }

        // SVG 基本設定
        const container = d3.select("#map-container");
        const width = 1000;
        const height = 500;

        const svg = container.append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet")
            .style("width", "100%")
            .style("height", "100%");

        // 加入一個背景矩形以捕捉拖曳事件
        svg.append("rect")
            .attr("width", width)
            .attr("height", height)
            .attr("fill", "transparent");

        // 建立一個包裹所有地圖元素的 group，用來處理縮放平移
        const g = svg.append("g");

        // 地圖投影設定 (使用 Natural Earth 投影看起來比較符合直覺的地球形狀)
        const projection = d3.geoNaturalEarth1()
            .scale(160)
            .translate([width / 2, height / 2.3]);

        const path = d3.geoPath().projection(projection);

        // 縮放行為設定
        const zoom = d3.zoom()
            .scaleExtent([1, 8]) // 限制縮放比例 1x ~ 8x
            .translateExtent([[0, 0], [width, height]])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // 綁定控制按鈕
        d3.select("#zoom-in").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 1.3);
        });
        d3.select("#zoom-out").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.3);
        });
        d3.select("#zoom-reset").on("click", () => {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        });

        // Tooltip 元素
        const tooltip = d3.select("#tooltip");

        // 載入 GeoJSON (使用 TopoJSON 以減少檔案大小)
        // 來源：unpkg 的 world-atlas
        const mapUrl = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";

        d3.json(mapUrl).then(function(world) {
            
            // 隱藏 Loading 動畫
            d3.select("#loading").transition().duration(500).style("opacity", 0).remove();

            // 繪製經緯度網格 (海洋感)
            const graticule = d3.geoGraticule();
            g.append("path")
                .datum(graticule)
                .attr("class", "graticule")
                .attr("d", path);

            // 擷取國家特徵資料
            const countries = topojson.feature(world, world.objects.countries).features;

            // 建立一個組包含所有國家，用於實現 CSS hover "其他變暗" 的特效
            const countriesGroup = g.append("g")
                .attr("class", "countries-group");

            // 繪製所有國家
            countriesGroup.selectAll("path")
                .data(countries)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                .on("mouseover", function(event, d) {
                    // 將當前懸停的國家移到最上層，避免邊界被周圍國家覆蓋
                    d3.select(this).raise();

                    const countryName = d.properties.name;

                    // 顯示 Tooltip 並設定內容
                    tooltip.style("opacity", 1)
                        .html(`
                            <div class="font-bold text-lg text-white mb-1">${countryName}</div>
                            <div class="text-xs text-sky-400 flex items-center gap-1 font-medium bg-sky-400/10 inline-flex px-2 py-1 rounded">
                                <span>點擊前往專屬職缺</span>
                                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </div>
                        `);
                })
                .on("mousemove", function(event) {
                    // Tooltip 跟隨游標 (考慮滾動條與視窗邊界)
                    const tooltipNode = tooltip.node();
                    const tooltipWidth = tooltipNode.offsetWidth;
                    const tooltipHeight = tooltipNode.offsetHeight;
                    
                    let left = event.pageX;
                    let top = event.pageY;

                    // 防止 Tooltip 超出右側螢幕
                    if (left + tooltipWidth / 2 > window.innerWidth) {
                        left = window.innerWidth - tooltipWidth / 2 - 10;
                    }
                    // 防止 Tooltip 超出左側螢幕
                    if (left - tooltipWidth / 2 < 0) {
                        left = tooltipWidth / 2 + 10;
                    }

                    tooltip.style("left", left + "px")
                           .style("top", top + "px");
                })
                .on("mouseleave", function(event, d) {
                    // 隱藏 Tooltip
                    tooltip.style("opacity", 0);
                })
                .on("click", function(event, d) {
                    const countryName = d.properties.name;
                    // 根據國家名稱獲取網址
                    const targetUrl = getJobUrl(countryName);
                    // 在新分頁開啟職缺網站
                    window.open(targetUrl, "_blank");
                })
                // 支援手機觸碰：在 touchstart 觸發 mouseover 效果
                .on("touchstart", function(event, d) {
                    d3.select(this).raise();
                }, {passive: true});

        }).catch(function(error) {
            console.error("載入地圖資料失敗: ", error);
            d3.select("#loading").html(`
                <p class="text-red-500 font-bold mb-2">地圖載入失敗</p>
                <p class="text-slate-400 text-sm">請檢查網路連線或重新整理頁面。</p>
            `);
        });

    </script>
</body>
</html>
